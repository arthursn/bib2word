[project]
name = "bib2word"
version = "0.1.0"
description = "Convert bibliographic references from YAML to Word-compatible XML, with DOI metadata fetching"
readme = "README.md"
authors = [{ name = "Arthur Nishikawa", email = "nishikawa.poli@gmail.com" }]
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0.3", "requests>=2.34.2"]

[project.scripts]
bib2word = "bib2word.cli:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
